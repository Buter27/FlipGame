<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Датчики: диагностика</title>
<style>
  body {
    margin: 0; padding: 16px; box-sizing: border-box;
    background: #0d0d0d; color: #e0e0e0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; line-height: 1.5;
  }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; color: #fff; }
  .step { margin-bottom: 14px; padding: 10px 12px; border-left: 3px solid #333; background: #161616; border-radius: 2px; }
  .step.ok { border-left-color: #2e7d32; }
  .step.fail { border-left-color: #c62828; }
  .step.warn { border-left-color: #f9a825; }
  .step-title { font-weight: 700; margin-bottom: 4px; }
  .step-detail { opacity: .8; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .live { margin-top: 20px; padding: 12px; background: #111; border: 1px solid #2a2a2a; border-radius: 2px; }
  .live-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; opacity: .5; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .row span:last-child { color: #4fc3f7; font-variant-numeric: tabular-nums; }
  .row.dim span:last-child { color: #666; }
  button {
    width: 100%; padding: 16px; margin-bottom: 16px;
    background: #fff; color: #000; border: 0; border-radius: 2px;
    font: inherit; font-weight: 700; letter-spacing: 2px; font-size: 14px;
  }
  button:active { opacity: .7; }
  #log { margin-top: 12px; font-size: 11px; opacity: .5; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
</style>
</head>
<body>

<h1>ДИАГНОСТИКА ДАТЧИКОВ</h1>
<button id="run">ЗАПУСТИТЬ ПРОВЕРКУ</button>

<div id="steps"></div>

<div class="live" id="live" style="display:none">
  <div class="live-title">Живые данные</div>
  <div class="row"><span>Accelerometer</span><span id="v-acc">—</span></div>
  <div class="row"><span>Gyroscope</span><span id="v-gyro">—</span></div>
  <div class="row"><span>devicemotion</span><span id="v-dm">—</span></div>
  <div class="row dim"><span>событий devicemotion</span><span id="v-dm-count">0</span></div>
</div>

<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const stepsEl = $('steps');
const logEl = $('log');

function addStep(title, status, detail) {
  const div = document.createElement('div');
  div.className = 'step ' + (status || '');
  div.innerHTML = `<div class="step-title">${title}</div><div class="step-detail">${detail || ''}</div>`;
  stepsEl.appendChild(div);
}

function log(msg) {
  logEl.textContent = `> ${msg}\n` + logEl.textContent;
}

// ---------- 1. Базовое окружение ----------
function checkEnvironment() {
  const secure = window.isSecureContext;
  const host = location.hostname;
  const proto = location.protocol;

  addStep(
    'Secure Context',
    secure ? 'ok' : 'fail',
    `isSecureContext = ${secure}\nprotocol = ${proto}\nhostname = ${host}`
  );

  if (!secure) {
    addStep(
      'Почему это важно',
      'fail',
      'Без secure context Chrome блокирует все сенсоры. Нужен HTTPS или localhost. GitHub Pages даёт HTTPS, но проверь, что открыт именно https://, а не http://.'
    );
  }
}

// ---------- 2. Наличие конструкторов ----------
function checkApis() {
  const hasAcc = 'Accelerometer' in window;
  const hasGyro = 'Gyroscope' in window;
  const hasDM = 'DeviceMotionEvent' in window;

  addStep(
    'Generic Sensor API',
    hasAcc && hasGyro ? 'ok' : 'fail',
    `Accelerometer: ${hasAcc}\nGyroscope: ${hasGyro}\nDeviceMotionEvent: ${hasDM}`
  );

  if (!hasAcc || !hasGyro) {
    addStep(
      'Что делать',
      'warn',
      'Конструкторы отсутствуют. Это значит, что либо браузер их не поддерживает, либо они отключены флагом. Проверь версию Chrome (152 должна поддерживать) и не включён ли какой-то режим экономии.'
    );
  }

  return { hasAcc, hasGyro, hasDM };
}

// ---------- 3. Permissions API ----------
async function checkPermissions() {
  const names = ['accelerometer', 'gyroscope'];
  for (const name of names) {
    if (!navigator.permissions || !navigator.permissions.query) {
      addStep(`Permissions API: ${name}`, 'warn', 'navigator.permissions.query недоступен');
      continue;
    }
    try {
      const status = await navigator.permissions.query({ name });
      addStep(
        `Разрешение: ${name}`,
        status.state === 'granted' ? 'ok' : status.state === 'denied' ? 'fail' : 'warn',
        `state = "${status.state}"`
      );
      status.onchange = () => {
        log(`permission ${name} -> ${status.state}`);
        addStep(
          `Разрешение: ${name} (изменилось)`,
          status.state === 'granted' ? 'ok' : 'fail',
          `state = "${status.state}"`
        );
      };
    } catch (e) {
      addStep(`Разрешение: ${name}`, 'warn', `Ошибка query: ${e.name}: ${e.message}`);
    }
  }
}

// ---------- 4. Прямая попытка конструктора ----------
async function tryConstruct() {
  const results = { acc: null, gyro: null };

  if ('Accelerometer' in window) {
    try {
      const a = new Accelerometer({ frequency: 60 });
      results.acc = { ok: true, instance: a };
      addStep('new Accelerometer()', 'ok', 'Конструктор создан без исключения');
    } catch (e) {
      results.acc = { ok: false, error: e };
      addStep('new Accelerometer()', 'fail', `${e.name}: ${e.message}`);
      explainConstructorError('Accelerometer', e);
    }
  }

  if ('Gyroscope' in window) {
    try {
      const g = new Gyroscope({ frequency: 60 });
      results.gyro = { ok: true, instance: g };
      addStep('new Gyroscope()', 'ok', 'Конструктор создан без исключения');
    } catch (e) {
      results.gyro = { ok: false, error: e };
      addStep('new Gyroscope()', 'fail', `${e.name}: ${e.message}`);
      explainConstructorError('Gyroscope', e);
    }
  }

  return results;
}

function explainConstructorError(label, e) {
  if (e.name === 'SecurityError') {
    addStep(
      `Что значит SecurityError для ${label}`,
      'fail',
      'Это блокировка на уровне Permissions Policy. Даже на HTTPS Chrome может запретить сенсор, если политика документа это не разрешает. GitHub Pages не отправляет заголовок Permissions-Policy, но браузер может применять политику по умолчанию или из-за настроек сайта.'
    );
  } else if (e.name === 'NotAllowedError') {
    addStep(
      `Что значит NotAllowedError для ${label}`,
      'warn',
      'Пользователь или браузер не дал разрешение. Попробуй найти в настройках сайта (замок в адресной строке → Разрешения) пункт «Датчики движения» и поставить «Разрешить».'
    );
  } else if (e.name === 'NotReadableError') {
    addStep(
      `Что значит NotReadableError для ${label}`,
      'warn',
      'Датчик есть, но недоступен (например, занят другим приложением или отключён в системе).'
    );
  }
}

// ---------- 5. Запуск и чтение ----------
function startSensors(results) {
  for (const [key, res] of Object.entries(results)) {
    if (!res || !res.ok) continue;
    const sensor = res.instance;
    const label = key === 'acc' ? 'Accelerometer' : 'Gyroscope';

    sensor.addEventListener('reading', () => {
      const el = key === 'acc' ? $('v-acc') : $('v-gyro');
      if (key === 'acc') {
        el.textContent = `${sensor.x.toFixed(3)}, ${sensor.y.toFixed(3)}, ${sensor.z.toFixed(3)}`;
      } else {
        el.textContent = `${sensor.x.toFixed(3)}, ${sensor.y.toFixed(3)}, ${sensor.z.toFixed(3)}`;
      }
    });

    sensor.addEventListener('error', (e) => {
      addStep(`${label}: ошибка после старта`, 'fail', `${e.error.name}: ${e.error.message}`);
    });

    try {
      sensor.start();
      addStep(`${label}.start()`, 'ok', 'Датчик запущен');
    } catch (e) {
      addStep(`${label}.start()`, 'fail', `${e.name}: ${e.message}`);
    }
  }
}

// ---------- 6. DeviceMotion fallback ----------
function setupDeviceMotion(hasDM) {
  if (!hasDM) {
    addStep('DeviceMotionEvent', 'warn', 'Событие отсутствует в window');
    return;
  }

  let count = 0;
  let received = false;

  const handler = (e) => {
    count++;
    received = true;
    $('v-dm-count').textContent = count;
    const acc = e.accelerationIncludingGravity;
    const rot = e.rotationRate;
    $('v-dm').textContent =
      `acc: ${acc ? `${acc.x?.toFixed(2)}, ${acc.y?.toFixed(2)}, ${acc.z?.toFixed(2)}` : '—'} | ` +
      `rot: ${rot ? `${rot.alpha?.toFixed(2)}, ${rot.beta?.toFixed(2)}, ${rot.gamma?.toFixed(2)}` : '—'}`;
  };

  window.addEventListener('devicemotion', handler, { passive: true });

  addStep(
    'DeviceMotionEvent',
    'ok',
    'Слушатель добавлен. Потряси телефон — если счётчик внизу растёт, этот API работает, даже если Generic Sensor API заблокирован.'
  );

  // Через 3 секунды проверим, пришли ли события
  setTimeout(() => {
    if (!received) {
      addStep(
        'DeviceMotionEvent: данные не пришли',
        'warn',
        'За 3 секунды не было ни одного события. Это может значить, что и этот API заблокирован, или телефон действительно неподвижен (но обычно события идут всегда).'
      );
    } else {
      addStep(
        'DeviceMotionEvent: данные идут',
        'ok',
        `Получено событий: ${count}. Если Generic Sensor API не работает, можно временно построить прототип на DeviceMotion.`
      );
    }
  }, 3000);
}

// ---------- Главный сценарий ----------
$('run').addEventListener('click', async () => {
  stepsEl.innerHTML = '';
  logEl.textContent = '';
  $('live').style.display = 'block';
  $('v-acc').textContent = '—';
  $('v-gyro').textContent = '—';
  $('v-dm').textContent = '—';
  $('v-dm-count').textContent = '0';

  log('старт диагностики');

  // 1
  checkEnvironment();

  // 2
  const apis = checkApis();

  // 3
  await checkPermissions();

  // 4
  const results = await tryConstruct();

  // 5
  startSensors(results);

  // 6
  setupDeviceMotion(apis.hasDM);

  log('диагностика завершена');
});
</script>
</body>
</html>
